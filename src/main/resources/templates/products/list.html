<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Danh sách sản phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Quản Lý Sản Phẩm</h1>
            <a th:href="@{/products/add}" sec:authorize="isAuthenticated()" class="btn btn-primary">+ Thêm Sản Phẩm Mới</a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Search Bar -->
        <form th:action="@{/products}" method="get" class="search-form">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên, thương hiệu, xuất xứ..." />
            <button type="submit" class="btn btn-secondary">Tìm kiếm</button>
            <a th:href="@{/products}" th:if="${keyword != null and !keyword.isEmpty()}" class="btn btn-warning">Xóa tìm kiếm</a>
        </form>

        <!-- Product Table -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Hình Ảnh</th>
                        <th>Tên Sản Phẩm</th>
                        <th>Thương Hiệu</th>
                        <th>Xuất Xứ</th>
                        <th>Giá Bán (VNĐ)</th>
                        <th>Người Đăng</th>
                        <th sec:authorize="isAuthenticated()">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${productPage.content}">
                        <td th:text="${product.id}">1</td>
                        <td>
                            <img th:src="${product.images != null and !#strings.isEmpty(product.images) ? product.images : '/images/phone.png'}"
                                 alt="Product Image" class="table-img" />
                        </td>
                        <td><strong th:text="${product.name}">Tên SP</strong></td>
                        <td th:text="${product.brand}">Brand</td>
                        <td th:text="${product.madein}">Made in</td>
                        <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'" style="color: #2563eb; font-weight: bold;">0 VNĐ</td>
                        <td th:text="${product.userFullName != null ? product.userFullName : 'Hệ thống'}">Admin</td>
                        <td sec:authorize="isAuthenticated()">
                            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-secondary btn-sm" style="margin-right: 4px;">Sửa</a>
                            <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">Xóa</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productPage.content)}">
                        <td colspan="8" style="text-align: center; color: #64748b; padding: 24px;">Không tìm thấy sản phẩm nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}">
            <ul class="pagination">
                <li th:class="${currentPage == 0} ? 'disabled' : ''">
                    <a th:href="@{/products(page=0, keyword=${keyword})}">« Đầu</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:class="${currentPage == i} ? 'active' : ''">
                    <a th:href="@{/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                </li>
                <li th:class="${currentPage == totalPages - 1} ? 'disabled' : ''">
                    <a th:href="@{/products(page=${totalPages - 1}, keyword=${keyword})}">Cuối »</a>
                </li>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
