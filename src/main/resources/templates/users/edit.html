<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Cập nhật người dùng</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container">
        <div class="form-card">
            <h2>Cập Nhật Người Dùng #<span th:text="${userDTO.id}">1</span></h2>
            <p style="color: #64748b; margin-bottom: 20px;">Chỉnh sửa thông tin tài khoản người dùng</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/users/edit/{id}(id=${userDTO.id})}" th:object="${userDTO}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" readonly />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" readonly />
                </div>

                <div class="form-group">
                    <label for="fullName">Họ và tên</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required />
                </div>

                <div class="form-group">
                    <label for="roleId">Vai trò (Role)</label>
                    <select id="roleId" th:field="*{roleId}" class="form-control">
                        <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role.name}">ROLE_USER</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="enabled">Trạng thái tài khoản</label>
                    <select id="enabled" th:field="*{enabled}" class="form-control">
                        <option th:value="true" th:selected="${userDTO.enabled}">Hoạt động</option>
                        <option th:value="false" th:selected="${!userDTO.enabled}">Tạm khóa / Chưa kích hoạt</option>
                    </select>
                </div>

                <div class="form-group" th:if="${userDTO.images != null}">
                    <label>Avatar hiện tại</label>
                    <div style="margin-top: 6px;">
                        <img th:src="${userDTO.images}" alt="Avatar" style="width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 1px solid #cbd5e1;" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="imageFile">Thay đổi Avatar (nếu có)</label>
                    <input type="file" id="imageFile" name="imageFile" class="form-control" accept="image/*" />
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
                    <a th:href="@{/users}" class="btn btn-secondary">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
