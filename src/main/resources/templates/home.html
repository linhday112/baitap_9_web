<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Dashboard')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <div class="page-header">
        <div class="page-title-group">
            <h1 class="page-title">
                <span>📊</span> Tổng quan Dashboard
            </h1>
            <p class="page-subtitle">Chào mừng bạn quay trở lại với hệ thống quản lý IOTSTAR SHOP</p>
        </div>
    </div>

    <div th:if="${success}" class="alert-box alert-success" th:text="${success}"></div>

    <div class="cards-grid">
        <div class="stat-card">
            <div class="stat-info">
                <h3>Tổng số Người dùng</h3>
                <div class="number" th:text="${userCount}">0</div>
            </div>
            <div class="stat-icon-wrapper stat-icon-blue">
                <span>👥</span>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-info">
                <h3>Tổng số Sản phẩm</h3>
                <div class="number" th:text="${productCount}">0</div>
            </div>
            <div class="stat-icon-wrapper stat-icon-purple">
                <span>📦</span>
            </div>
        </div>
    </div>

    <div style="background: var(--surface); border-radius: var(--radius-xl); border: 1px solid var(--border); padding: 2rem; box-shadow: var(--shadow-sm);">
        <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1rem; color: var(--text-main);">🚀 Lối truy cập nhanh</h2>
        <div class="quick-links">
            <a class="btn btn-primary" th:href="@{/products}">
                <span>📦</span> Quản lý Sản Phẩm (Products)
            </a>
            <a class="btn btn-secondary" 
               th:if="${#authorization.expression('hasRole(''ADMIN'')')}" 
               th:href="@{/users}">
                <span>👥</span> Quản lý Người Dùng (Users)
            </a>
        </div>
    </div>
</main>
</div>
</body>
</html>
