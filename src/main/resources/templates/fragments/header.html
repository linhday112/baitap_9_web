<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="header">
    <a th:href="@{/}" class="brand">
        <div class="brand-icon">🛍️</div>
        <span>IOTSTAR SHOP</span>
    </a>
    <nav>
        <a th:href="@{/}">
            <span>📊</span> Dashboard
        </a>
        <a th:href="@{/products}">
            <span>📦</span> Products
        </a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" 
           th:href="@{/users}">
            <span>👥</span> Users
        </a>
    </nav>
    <div class="account-area" th:if="${#authorization.expression('isAuthenticated()')}">
        <div class="account-badge">
            <div class="avatar-circle" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</div>
            <span class="account-name" th:text="${#authentication.name}">Username</span>
        </div>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="link-button">
                <span>🚪</span> Đăng xuất
            </button>
        </form>
    </div>
    <div class="account-area" th:unless="${#authorization.expression('isAuthenticated()')}">
        <a th:href="@{/login}" class="btn btn-primary btn-sm">
            <span>🔑</span> Đăng nhập
        </a>
    </div>
</header>
</body>
</html>
