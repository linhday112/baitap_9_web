<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quên mật khẩu</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Quên mật khẩu</h2>
            <p class="subtitle">Nhập email đã đăng ký để nhận mã khôi phục OTP</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Nhập địa chỉ email" required autofocus />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Gửi mã OTP</button>
            </form>

            <div class="auth-links">
                <p><a th:href="@{/login}">Quay lại Đăng nhập</a></p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
