<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 22px;">🔓</div>
            <h1>Quên mật khẩu</h1>
            <p>Nhập địa chỉ Gmail để nhận mã OTP khôi phục mật khẩu</p>
        </div>

        <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert-box alert-error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <div class="form-group">
                <label class="form-label">Email của bạn</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="example@gmail.com" required>
            </div>
            <button class="btn btn-primary btn-full" type="submit" style="margin-top: 12px;">
                <span>✉️</span> Gửi mã OTP khôi phục
            </button>
        </form>

        <div class="auth-footer-links">
            <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
        </div>
    </div>
</div>
</body>
</html>
