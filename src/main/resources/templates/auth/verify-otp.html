<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận mã OTP')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 22px;">🔑</div>
            <h1>Xác nhận mã OTP Đăng ký</h1>
            <p>Nhập mã OTP 6 chữ số vừa được gửi về Gmail của bạn</p>
        </div>

        <div th:if="${success}" class="alert-box alert-success" th:text="${success}"></div>

        <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert-box alert-error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <div class="form-group">
                <label class="form-label">Email của bạn</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="Gmail đã đăng ký..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Mã OTP (6 chữ số)</label>
                <input th:field="*{otp}" maxlength="6" inputmode="numeric" class="form-control" style="font-size: 1.25rem; letter-spacing: 4px; text-align: center; font-weight: 700;" placeholder="000000" required autofocus>
            </div>

            <button class="btn btn-primary btn-full" type="submit" style="margin-top: 12px;">
                <span>✓</span> Xác nhận OTP & Kích hoạt tài khoản
            </button>
        </form>

        <form th:action="@{/resend-register-otp}" method="post" style="margin-top: 12px;">
            <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
            <button class="btn btn-secondary btn-full" type="submit">
                <span>🔄</span> Gửi lại mã OTP qua Email
            </button>
        </form>

        <div class="auth-footer-links">
            <a th:href="@{/login}">Quay lại trang Đăng nhập</a>
        </div>
    </div>
</div>
</body>
</html>
