<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 22px;">🛍️</div>
            <h1>Đăng nhập</h1>
            <p>Chào mừng quay trở lại với IOTSTAR SHOP</p>
        </div>

        <div th:if="${param.error}" class="alert-box alert-error">Username/password không chính xác hoặc tài khoản chưa xác thực OTP.</div>
        <div th:if="${param.logout}" class="alert-box alert-success">Bạn đã đăng xuất thành công.</div>
        <div th:if="${success}" class="alert-box alert-success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input name="username" class="form-control" placeholder="Nhập tên đăng nhập..." required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." required>
            </div>
            <button class="btn btn-primary btn-full" type="submit" style="margin-top: 8px;">
                <span>🔑</span> Đăng nhập ngay
            </button>
        </form>

        <div class="auth-footer-links" style="margin-top: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px;">
            <div>
                <span>Chưa có tài khoản? </span>
                <a th:href="@{/register}" style="font-weight: 700; color: #4f46e5; text-decoration: underline;">Tạo tài khoản mới</a>
            </div>
            <div>
                <a th:href="@{/forgot-password}" class="btn btn-secondary btn-full" style="display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 10px 16px; margin-top: 4px;">
                    <span>🔐</span> Quên mật khẩu? Click để khôi phục
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
