<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng ký tài khoản')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-box" style="max-width: 480px;">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 22px;">🛍️</div>
            <h1>Tạo tài khoản mới</h1>
            <p>Đăng ký tài khoản để mua sắm và quản lý sản phẩm</p>
        </div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert-box alert-error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>

            <div class="form-group">
                <label class="form-label">Username <span style="color:#ef4444;">*</span></label>
                <input th:field="*{username}" class="form-control" placeholder="Tên đăng nhập...">
                <span class="error-text" th:errors="*{username}"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Email <span style="color:#ef4444;">*</span></label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="Tài khoản Gmail nhận mã OTP...">
                <span class="error-text" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Họ và Tên <span style="color:#ef4444;">*</span></label>
                <input th:field="*{fullName}" class="form-control" placeholder="Họ và tên của bạn...">
                <span class="error-text" th:errors="*{fullName}"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu <span style="color:#ef4444;">*</span></label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự...">
                <span class="error-text" th:errors="*{password}"></span>
            </div>

            <div class="form-group">
                <label class="form-label">Xác nhận mật khẩu <span style="color:#ef4444;">*</span></label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu...">
                <span class="error-text" th:errors="*{confirmPassword}"></span>
            </div>

            <button class="btn btn-primary btn-full" type="submit" style="margin-top: 12px;">
                <span>✉️</span> Đăng ký & Nhận mã OTP
            </button>
        </form>

        <div class="auth-footer-links">
            <a th:href="@{/login}">Đã có tài khoản? <strong>Đăng nhập tại đây</strong></a>
        </div>
    </div>
</div>
</body>
</html>
