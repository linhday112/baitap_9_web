server.port=8080
spring.application.name=springboot-security-app

# H2 Database configuration (Embedded, out-of-the-box running)
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Commented out - can be enabled if MySQL is used)
# spring.datasource.url=jdbc:mysql://localhost:3306/springb3_security6?createDatabaseIfNotExist=true&useSSL=false&characterEncoding=UTF-8
# spring.datasource.username=root
# spring.datasource.password=123456
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Uploads directory configuration
app.upload.dir=uploads/

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Mail Configuration (Dummy/Local SMTP for development)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
