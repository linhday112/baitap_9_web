<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Truy cập bị từ chối (403)</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container" style="text-align: center; padding: 60px 20px;">
        <h1 style="font-size: 72px; color: #dc2626; margin-bottom: 16px;">403</h1>
        <h2 style="font-size: 28px; margin-bottom: 16px; color: #0f172a;">Truy Cập Bị Từ Chối (Access Denied)</h2>
        <p style="color: #64748b; font-size: 16px; max-width: 500px; margin: 0 auto 28px;">
            Rất tiếc! Bạn không có quyền truy cập vào trang này. Vui lòng liên hệ Quản trị viên (Admin) hoặc quay về trang chủ.
        </p>
        <a th:href="@{/}" class="btn btn-primary">Quay Về Trang Chủ</a>
    </div>
</main>
</body>
</html>
