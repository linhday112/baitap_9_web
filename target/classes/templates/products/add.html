<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Thêm sản phẩm mới</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container">
        <div class="form-card">
            <h2>Thêm Sản Phẩm Mới</h2>
            <p style="color: #64748b; margin-bottom: 20px;">Vui lòng nhập đầy đủ thông tin sản phẩm</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/products/add}" th:object="${productDTO}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="name">Tên sản phẩm</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm" required />
                    <p class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="form-group">
                    <label for="brand">Thương hiệu</label>
                    <input type="text" id="brand" th:field="*{brand}" class="form-control" placeholder="Nhập thương hiệu" required />
                    <p class="error-text" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></p>
                </div>

                <div class="form-group">
                    <label for="madein">Xuất xứ (Made in)</label>
                    <input type="text" id="madein" th:field="*{madein}" class="form-control" placeholder="Nhập xuất xứ (Ví dụ: Mỹ, Việt Nam...)" required />
                    <p class="error-text" th:if="${#fields.hasErrors('madein')}" th:errors="*{madein}"></p>
                </div>

                <div class="form-group">
                    <label for="price">Giá bán (VNĐ)</label>
                    <input type="number" id="price" th:field="*{price}" step="1000" class="form-control" placeholder="Nhập giá bán" required />
                    <p class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                </div>

                <div class="form-group">
                    <label for="imageFile">Hình ảnh sản phẩm</label>
                    <input type="file" id="imageFile" th:field="*{imageFile}" class="form-control" accept="image/*" />
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary">Lưu Sản Phẩm</button>
                    <a th:href="@{/products}" class="btn btn-secondary">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
