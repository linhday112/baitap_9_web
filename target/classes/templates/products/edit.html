<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Cập nhật sản phẩm</title>
</head>
<body>
<main layout:fragment="content">
    <div class="container">
        <div class="form-card">
            <h2>Cập Nhật Sản Phẩm #<span th:text="${productDTO.id}">1</span></h2>
            <p style="color: #64748b; margin-bottom: 20px;">Chỉnh sửa thông tin chi tiết sản phẩm</p>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/products/edit/{id}(id=${productDTO.id})}" th:object="${productDTO}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{images}" />

                <div class="form-group">
                    <label for="name">Tên sản phẩm</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required />
                    <p class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="form-group">
                    <label for="brand">Thương hiệu</label>
                    <input type="text" id="brand" th:field="*{brand}" class="form-control" required />
                    <p class="error-text" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></p>
                </div>

                <div class="form-group">
                    <label for="madein">Xuất xứ</label>
                    <input type="text" id="madein" th:field="*{madein}" class="form-control" required />
                    <p class="error-text" th:if="${#fields.hasErrors('madein')}" th:errors="*{madein}"></p>
                </div>

                <div class="form-group">
                    <label for="price">Giá bán (VNĐ)</label>
                    <input type="number" id="price" th:field="*{price}" step="1000" class="form-control" required />
                    <p class="error-text" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                </div>

                <div class="form-group" th:if="${productDTO.images != null}">
                    <label>Hình ảnh hiện tại</label>
                    <div style="margin-top: 6px;">
                        <img th:src="${productDTO.images}" alt="Product Image" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1;" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="imageFile">Thay đổi hình ảnh mới (nếu có)</label>
                    <input type="file" id="imageFile" th:field="*{imageFile}" class="form-control" accept="image/*" />
                </div>

                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="submit" class="btn btn-primary">Cập nhật sản phẩm</button>
                    <a th:href="@{/products}" class="btn btn-secondary">Hủy bỏ</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
