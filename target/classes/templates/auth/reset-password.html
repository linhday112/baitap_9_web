<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận OTP & Đặt lại mật khẩu')}"></head>
<body>
<div class="auth-wrapper">
    <div class="auth-box">
        <div class="auth-header">
            <div class="brand-icon" style="margin: 0 auto 12px; width: 44px; height: 44px; font-size: 22px;">🔑</div>
            <h1>Xác nhận OTP & Đặt lại mật khẩu</h1>
            <p>Nhập mã OTP 6 số từ Gmail và mật khẩu mới của bạn</p>
        </div>

        <div th:if="${success}" class="alert-box alert-success" th:text="${success}"></div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert-box alert-error">
                <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
            </div>
            <div class="form-group">
                <label class="form-label">Email tài khoản</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="Gmail..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Mã OTP (6 chữ số trong Gmail)</label>
                <input name="otp" maxlength="6" inputmode="numeric" class="form-control" style="font-size: 1.25rem; letter-spacing: 4px; text-align: center; font-weight: 700;" placeholder="000000" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự..." required>
            </div>

            <div class="form-group">
                <label class="form-label">Xác nhận mật khẩu mới</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu mới..." required>
            </div>

            <button class="btn btn-primary btn-full" type="submit" style="margin-top: 12px;">
                <span>💾</span> Xác nhận OTP & Đổi mật khẩu
            </button>
        </form>

        <div class="auth-footer-links">
            <a th:href="@{/forgot-password}">Gửi lại mã OTP khác</a>
            <a th:href="@{/login}" style="color: var(--text-muted);">Quay lại trang Đăng nhập</a>
        </div>
    </div>
</div>
</body>
</html>
