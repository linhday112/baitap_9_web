<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đặt lại mật khẩu</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Đặt lại mật khẩu mới</h2>
            <p class="subtitle">Nhập mã OTP và mật khẩu mới của bạn</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required readonly />
                </div>

                <div class="form-group">
                    <label for="otp">Mã OTP (6 chữ số)</label>
                    <input type="text" id="otp" th:field="*{otp}" class="form-control" placeholder="Nhập mã OTP" required maxlength="6" autofocus />
                    <p class="error-text" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></p>
                </div>

                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control" placeholder="Nhập mật khẩu mới" required />
                    <p class="error-text" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Lưu mật khẩu mới</button>
            </form>

            <div class="auth-links">
                <p><a th:href="@{/login}">Quay lại trang Đăng nhập</a></p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
