<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Xác thực OTP</title>
</head>
<body>
<main layout:fragment="content">
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Xác thực tài khoản OTP</h2>
            <p class="subtitle">Nhập mã OTP vừa được gửi đến email của bạn</p>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/verify-otp}" method="post">
                <div class="form-group">
                    <label for="email">Địa chỉ Email</label>
                    <input type="email" id="email" name="email" th:value="${email}" class="form-control" required readonly />
                </div>

                <div class="form-group">
                    <label for="otp">Mã OTP (6 chữ số)</label>
                    <input type="text" id="otp" name="otp" class="form-control" placeholder="Ví dụ: 123456" required maxlength="6" autofocus />
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Xác nhận OTP</button>
            </form>

            <div class="auth-links">
                <p><a th:href="@{/login}">Quay lại trang Đăng nhập</a></p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
